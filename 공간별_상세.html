else{document.title=room.name+' · 부산 ICTC';title.textContent=room.name;document.getElementById('total').textContent=room.count===0&&room.note?'확인 필요':room.count+'점';if(room.note&&key!=='rack'&&key!=='eval'&&key!=='emerg'&&key!=='debrief'&&key!=='office'&&key!=='pool'&&key!=='main'&&key!=='teachers'){let box=document.createElement('div');box.className='notice';box.textContent=room.note;note.append(box)}if(room.groups.length===0){empty.hidden=false;empty.textContent=key==='fire'?'등록 장소를 확인한 뒤 물품별 개체현황을 연결할 예정입니다.':'현재 승인된 개체정보에서 해당 장소에 직접 일치하는 물품을 확인하지 못했습니다. 다른 장소의 물품을 임의 배치하지 않았습니다.'}
for(const item of room.groups){const a=document.createElement('a');a.className='card';a.href=item.href;const p=document.createElement('div');p.className='thumb';const im=document.createElement('img');im.loading='lazy';im.src=item.photo;im.alt=item.name+' 대표사진';p.append(im);const t=document.createElement('span');t.className='title';t.textContent=item.name;t.title=item.name;a.title=item.name;const c=document.createElement('span');c.className='count';c.append(document.createTextNode(String(item.count)));const unit=document.createElement('span');unit.className='unit';unit.textContent='점';c.append(unit);const meta=document.createElement('div');meta.className='card-meta';meta.append(t,c);a.append(p,meta);grid.append(a)}}
</script>
<script>
/* 공간 조감도는 원본을 변경하지 않고 확대 기능만 제공 */
(()=>{
 const figure=document.querySelector('.hero .a-overview-visual');
 if(!figure||!figure.querySelector('img'))return;
 figure.setAttribute('role','button');figure.setAttribute('tabindex','0');
 figure.setAttribute('aria-label',(document.getElementById('title').textContent||'공간')+' 조감도 확대 보기');
 const dialog=document.createElement('dialog');dialog.className='ictc-overview-dialog';
 const close=document.createElement('button');close.type='button';close.className='ictc-overview-close';close.textContent='닫기 ×';close.setAttribute('aria-label','확대 이미지 닫기');
 const im=document.createElement('img');im.src=figure.querySelector('img').src;im.alt=figure.querySelector('img').alt;
 dialog.append(close,im);document.body.append(dialog);
 const open=()=>{if(!dialog.open)dialog.showModal()};
 figure.addEventListener('click',open);
 figure.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open()}});
 close.addEventListener('click',()=>dialog.close());
 dialog.addEventListener('click',ev=>{if(ev.target===dialog)dialog.close()});
})();
</script>
