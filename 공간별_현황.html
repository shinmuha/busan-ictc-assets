<style>
:root{color-scheme:dark;--navy:#081d2c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
.stage{position:relative;width:min(100%,1672px);margin:0 auto;aspect-ratio:1672/941;isolation:isolate;line-height:0}
/* This is the exact, unchanged visual the user approved. All design, reflections and typography are in the original PNG. */
.approved-image{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.label-target{position:absolute;display:block;z-index:2;border-radius:8px;outline:none;cursor:pointer}
.label-target:hover{background-color:rgba(205,232,248,.055)}
.label-target:focus-visible{outline:3px solid #f64c61;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mobile-nav{display:none}
@media(max-width:700px){
 .mobile-nav{display:block;margin:16px auto 32px;width:min(100% - 32px,600px);color:#ecf5fc;line-height:1.5}
 .mobile-nav h2{font-size:17px;margin:0 0 10px;font-weight:700}
 .mobile-nav .links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .mobile-nav a{display:flex;gap:7px;align-items:center;justify-content:space-between;color:#ebf5ff;background:#112f42;border:1px solid #385a71;padding:11px 12px;min-height:48px;border-radius:5px;text-decoration:none;font-size:13px}
 .mobile-nav a:focus-visible{outline:2px solid #ff667a;outline-offset:2px}
}

/* 텍스트 전용 보정 레이어 — 기존 1672x941 승인 PNG는 절대 수정하지 않음 */
.stage .overlay-label{
  display:flex;align-items:center;justify-content:space-between;gap:5px;
  line-height:1.35;white-space:nowrap;text-decoration:none;overflow:hidden;
  color:#f1f8fd;
  background:linear-gradient(176deg,#0b2b43 0%,#082239 55%,#061b30 100%);
  border:1px solid rgba(116,183,225,.74);
  border-radius:8px;
  box-shadow:inset 0 0 0 1px rgba(6,15,31,.31),0 2px 15px rgba(0,0,0,.20);
  padding:0 13px 1px 16px;
  backdrop-filter:none;
  -webkit-font-smoothing:antialiased;
  font-size:21px;font-weight:700;letter-spacing:-.02em;
}
.stage .overlay-label .visible-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.38;padding-block:2px;font-family:"Malgun Gothic","Noto Sans CJK KR","NanumGothic",sans-serif;}
.stage .overlay-label .visible-arrow{flex:none;font-family:Arial,sans-serif;font-size:27px;font-weight:400;color:#d3e7f6;line-height:.9;}
.stage .overlay-label.menu{border-color:rgba(88,156,206,.72);font-size:20px;font-weight:700;padding:0 18px 0 17px;background:linear-gradient(155deg,#08263d 0%,#071f34 65%,#071e32 100%);}
.stage .overlay-label.menu .visible-arrow{font-size:30px;font-weight:200;line-height:0.85;}
.stage .overlay-label[data-display-name="긴급구조통제단실"]{font-size:19px;padding-left:15px;padding-right:10px;}
.stage .overlay-label[data-display-name="2층 전술관(소방시설)"],
.stage .overlay-label[data-display-name="1층 전술관(화재창고)"]{font-size:19px;letter-spacing:-.02em;}
.stage .overlay-label[data-display-name="4층 강사대기실"]{font-size:20px;}
.stage .overlay-label:hover{background:linear-gradient(176deg,#123b59 0%,#0b2c45 100%);border-color:rgba(188,230,252,.95);}
.stage .overlay-label:focus-visible{outline:3px solid #fb6176;outline-offset:3px;}
/* The image and its overlaid labels scale together at narrower viewport sizes. */
@media(max-width:1671px){
  .stage .overlay-label{font-size:clamp(6px,1.256vw,21px);padding-left:0.96%;padding-right:0.78%;border-radius:0.48vw;}
  .stage .overlay-label.menu{font-size:clamp(6px,1.2vw,20px);padding-left:1.02%;padding-right:1.05%;}
  .stage .overlay-label[data-display-name="긴급구조통제단실"],
  .stage .overlay-label[data-display-name="2층 전술관(소방시설)"],
  .stage .overlay-label[data-display-name="1층 전술관(화재창고)"]{font-size:clamp(6px,1.14vw,19px);}
  .stage .overlay-label .visible-arrow{font-size:clamp(7px,1.62vw,27px)}
  .stage .overlay-label.menu .visible-arrow{font-size:clamp(7px,1.8vw,30px)}
}
</style>
