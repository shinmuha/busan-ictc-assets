<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부산 ICTC 소방청 국가자산 물품 현황</title>
<style>
:root {color-scheme: light; --deep:#101922; --paper:#f2f1ee}
*{box-sizing:border-box}
html,body{padding:0;margin:0;min-height:100%;background:var(--deep);font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif}
/* The entire approved main page remains visually unchanged outside the left item card. */
.stage {position:relative;width:min(100%,1672px);margin:0 auto;aspect-ratio:1672/941;container-type:inline-size;}
.approved-scene {display:block;width:100%;height:100%;object-fit:contain;user-select:none;}
/* This single exact-position replacement masks only the prior synthetic board art. */
.item-card {
 position:absolute;left:3.35%;top:54.83%;width:25.94%;height:39.14%;
 display:block;overflow:hidden;border-radius:3.1%/3.5%;
 border:1px solid rgba(217,222,225,.64);
 background:radial-gradient(ellipse 110% 80% at 15% 13%, rgba(255,255,255,.96),transparent 69%),
 linear-gradient(108deg,#f4f4f4 0%,#ededee 36%,#d9dcdf 64%,#9da6b0 100%);
 box-shadow: inset 0 1px 1px #fff8;
 color:#102536;text-decoration:none;cursor:pointer;isolation:isolate;
}
.item-card:before {content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,26,38,.06),transparent 36%);pointer-events:none;}
.item-card strong {position:absolute;left:7.3%;top:5.3%;font-size:2.55cqw;line-height:1.1;font-weight:900;letter-spacing:-.05em;z-index:2;color:#0e2638;white-space:nowrap}
.item-card .arr {position:absolute;top:6.8%;right:6.8%;width:10%;height:auto;z-index:2;stroke:#142b38;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Original, unretouched, transparent electronic-board PNG: no crop, no distortion. */
.item-card img {position:absolute;left:17%;top:14.2%;width:76%;height:85.2%;object-fit:contain;object-position:center bottom;z-index:1;max-width:none}
.item-card:hover {box-shadow:inset 0 0 0 2px rgba(220,228,232,.65)}
.item-card:focus-visible,.room-target:focus-visible,.home-target:focus-visible {outline:3px solid #ef4e5f;outline-offset:3px}
.room-target {position:absolute;left:30.5%;top:54.83%;width:28.25%;height:39.14%;border-radius:12px;text-indent:-9999px;overflow:hidden}
.home-target {position:absolute;left:2.1%;top:2.5%;width:3.15%;height:5%;border-radius:2px;text-indent:-9999px;overflow:hidden}
/* Content remains accessible to assistive technology even though the approved design is a visual reference. */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){
 body{background:var(--paper)}
 .stage{min-width:0;}
 .item-card strong{font-size:2.55cqw}
}

/* 참고 통계: 이미지 밖의 독립 HTML 글자. 승인 이미지 및 카드에 영향 없음 */
.inventory-summary{
 position:absolute;left:22.9%;top:44.14%;z-index:2;
 font-size:2.0cqw;line-height:1.28;font-weight:650;letter-spacing:-.035em;
 white-space:nowrap;color:#d3e0e8;text-shadow:0 2px 10px rgba(0,0,0,.36);
 pointer-events:none;
}
</style>
</head>
<body>
<main class="stage" aria-label="부산 ICTC 소방청 국가자산 물품 현황">
<img class="approved-scene" src="assets/메인_승인시안.png" alt="부산 ICTC 소방청 국가자산 물품 현황. 우측 시스템관리실 랙, 좌측 물품별·공간별 선택 카드가 있는 확정 메인화면.">
<span class="inventory-summary" title="금액은 부산·강원 구축·운영 합산 사업비를 절반으로 나눈 참고 추정치이며, 부산의 공식 자산가액이 아닙니다.">(37종 383점 · 약 18.6억원)</span>
<a class="home-target" href="index.html" aria-label="홈으로 돌아가기">홈</a>
<a class="item-card" href="조회페이지.html#view=items" aria-label="물품별 조회로 이동">
<strong>물품별</strong>
<svg class="arr" viewBox="0 0 44 44" aria-hidden="true"><path d="M7 37 L37 7 M13 7 H37 V31"/></svg>
<img src="assets/전자칠판.png" alt="사용자가 제공한 원본 전자칠판 사진" loading="eager" decoding="async">
</a>
<a class="room-target" href="조회페이지.html#view=spaces" aria-label="공간별 조회로 이동">공간별</a>
<h1 class="sr-only">부산 ICTC 소방청 국가자산 물품 현황</h1>
</main>
</body>
</html>
